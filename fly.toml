# fly.toml app configuration file generated for meditrack-render-ambered-sky-5891 on 2026-07-26T18:24:06+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meditrack-render-v3'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/healthz'

# Shared CPU to cut cost. Keep 4gb: Chromium + Remotion OOM'd at 2gb.
[[vm]]
  size = 'shared-cpu-4x'
  memory = '4gb'
